<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No external requests: this dashboard renders a team's traffic metadata
         and must be usable on an air-gapped host. Inter is bundled, not fetched. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="./nearform-icon.svg" />
    <title>Fest</title>
    <script>
      // Pre-paint, so the dashboard never flashes the wrong theme on reload.
      // Deliberately inline: a fetched file would be a round trip before first
      // paint, which is the thing this exists to avoid. Kept in sync with
      // src/lib/theme.tsx, which owns the same key and class name.
      (function () {
        try {
          var stored = localStorage.getItem("fest-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
